<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Concentración de empresas por región</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <style>
        :root {
            font-family: 'Georgia', 'Inter', sans-serif;
            color: #1f2933;
        }
        body {
            margin: 0;
            background: transparent;
        }
        .chart-wrapper {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
            position: relative;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }
        .chart-stage {
            position: relative;
        }
        #regionBarContainer {
            min-height: 600px;
        }
        .theme-toggle {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 38px;
            height: 38px;
            border-radius: 999px;
            border: 1px solid rgba(15, 23, 42, 0.25);
            background: rgba(255, 255, 255, 0.85);
            color: #0f172a;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            z-index: 2;
        }
        .theme-toggle:hover {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="chart-wrapper">
        <div class="chart-stage">
            <div id="regionBarContainer"></div>
            <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema">☼</button>
        </div>
    </div>
    <script>
        const CATEGORIES = ["La Araucanía", "Los Ríos", "Los Lagos", "Biobío"];
        const SERIES_VALUES = [5, 11, 16, 42];

        const chartOptions = {
            chart: {
                type: 'bar',
                backgroundColor: '#ffffff'
            },
            title: {
                text: 'Concentración de empresas por región'
            },
            subtitle: {
                text: 'Fuente: EBCT Chile 2025'
            },
            xAxis: {
                categories: CATEGORIES,
                title: { text: null },
                gridLineWidth: 1,
                lineWidth: 0
            },
            yAxis: {
                min: 0,
                title: {
                    text: 'Número de empresas',
                    align: 'high'
                },
                labels: {
                    overflow: 'justify'
                },
                gridLineWidth: 0
            },
            tooltip: {
                valueSuffix: ' empresas'
            },
            plotOptions: {
                bar: {
                    borderRadius: '50%',
                    dataLabels: {
                        enabled: true,
                        format: '{point.y}'
                    },
                    groupPadding: 0.1
                }
            },
            legend: {
                layout: 'vertical',
                align: 'right',
                verticalAlign: 'top',
                x: -40,
                y: 80,
                floating: true,
                borderWidth: 1,
                backgroundColor: 'var(--highcharts-background-color, #ffffff)',
                shadow: true
            },
            credits: { enabled: false },
            series: [{
                name: 'Número de empresas',
                data: SERIES_VALUES,
                color: '#0f8b8d'
            }]
        };

        const chart = Highcharts.chart('regionBarContainer', chartOptions);
        const toggleBtn = document.getElementById('themeToggle');
        const chartWrapper = document.querySelector('.chart-wrapper');
        let darkMode = false;

        function applyTheme() {
            chart.update({
                chart: {
                    backgroundColor: darkMode ? '#0f172a' : '#ffffff'
                },
                title: { style: { color: darkMode ? '#f8fafc' : '#0f172a' } },
                subtitle: { style: { color: darkMode ? '#cbd5f5' : '#475569' } },
                xAxis: {
                    labels: { style: { color: darkMode ? '#e2e8f0' : '#0f172a' } },
                    gridLineColor: darkMode ? 'rgba(248,250,252,0.15)' : '#e2e8f0'
                },
                yAxis: {
                    labels: { style: { color: darkMode ? '#e2e8f0' : '#0f172a' } },
                    title: { style: { color: darkMode ? '#e2e8f0' : '#0f172a' } }
                },
                legend: {
                    itemStyle: { color: darkMode ? '#f8fafc' : '#0f172a' },
                    backgroundColor: darkMode ? 'rgba(15, 23, 42, 0.65)' : 'rgba(255,255,255,1)'
                },
                tooltip: {
                    backgroundColor: darkMode ? 'rgba(15,23,42,0.9)' : 'rgba(255,255,255,0.95)',
                    style: { color: darkMode ? '#f8fafc' : '#0f172a' }
                },
                plotOptions: {
                    bar: {
                        dataLabels: {
                            style: { color: darkMode ? '#f8fafc' : '#0f172a' }
                        }
                    }
                },
                series: [{ color: darkMode ? '#7dd3fc' : '#0f8b8d' }]
            });

            if (chartWrapper) {
                chartWrapper.style.backgroundColor = darkMode ? '#0b1220' : '#ffffff';
                chartWrapper.style.boxShadow = darkMode
                    ? '0 8px 30px rgba(0, 0, 0, 0.45)'
                    : '0 8px 30px rgba(15, 23, 42, 0.08)';
            }
        }

        toggleBtn.addEventListener('click', () => {
            darkMode = !darkMode;
            toggleBtn.textContent = darkMode ? '☾' : '☼';
            toggleBtn.style.backgroundColor = darkMode ? 'rgba(15,23,42,0.75)' : 'rgba(255, 255, 255, 0.85)';
            toggleBtn.style.color = darkMode ? '#f8fafc' : '#0f172a';
            toggleBtn.style.borderColor = darkMode ? 'rgba(248, 250, 252, 0.45)' : 'rgba(15, 23, 42, 0.25)';
            applyTheme();
        });
    </script>
</body>
</html>
