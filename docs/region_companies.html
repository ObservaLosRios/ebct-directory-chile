<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Concentración de empresas por región</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/export-data.js"></script>
    <style>
        :root {
            font-family: 'Georgia', 'Inter', sans-serif;
            color: #1f2933;
        }
        body {
            margin: 0;
            background: transparent;
        }
        .chart-wrapper {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
            position: relative;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }
        .chart-stage {
            position: relative;
        }
        #regionBarContainer {
            min-height: 600px;
        }
    </style>
</head>
<body>
    <div class="chart-wrapper">
        <div class="chart-stage">
            <div id="regionBarContainer"></div>
        </div>
    </div>
    <script>
        const CATEGORIES = ["La Araucanía", "Los Ríos", "Los Lagos", "Biobío"];
        const SERIES_VALUES = [5, 11, 16, 42];

        const exportingOptions = {
            enabled: true,
            buttons: {
                contextButton: {
                    menuItems: [
                        'viewFullscreen',
                        'printChart',
                        'separator',
                        'downloadPNG',
                        'downloadJPEG',
                        'downloadSVG',
                        'separator',
                        'downloadCSV',
                        'downloadXLS',
                        'viewData'
                    ]
                }
            }
        };

        const chartOptions = {
            chart: {
                type: 'bar',
                backgroundColor: '#ffffff'
            },
            accessibility: { enabled: false },
            title: {
                text: 'Concentración de empresas por región'
            },
            subtitle: {
                text: 'Fuente: EBCT Chile 2025'
            },
            xAxis: {
                categories: CATEGORIES,
                title: { text: null },
                gridLineWidth: 1,
                lineWidth: 0
            },
            yAxis: {
                min: 0,
                title: {
                    text: 'Número de empresas',
                    align: 'high'
                },
                labels: {
                    overflow: 'justify'
                },
                gridLineWidth: 0
            },
            tooltip: {
                valueSuffix: ' empresas'
            },
            plotOptions: {
                bar: {
                    borderRadius: '50%',
                    dataLabels: {
                        enabled: true,
                        format: '{point.y}'
                    },
                    groupPadding: 0.1
                }
            },
            legend: {
                layout: 'vertical',
                align: 'right',
                verticalAlign: 'top',
                x: -40,
                y: 80,
                floating: true,
                borderWidth: 1,
                backgroundColor: 'var(--highcharts-background-color, #ffffff)',
                shadow: true
            },
            credits: { enabled: false },
            exporting: exportingOptions,
            series: [{
                name: 'Número de empresas',
                data: SERIES_VALUES,
                color: '#0f8b8d'
            }]
        };

        Highcharts.chart('regionBarContainer', chartOptions);
    </script>
</body>
</html>
