<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observatorio EBCT Chile</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/treemap.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>
    <style>
        .section { display: none; }
        .section.active { display: block; }
        .chart-card {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
            position: relative;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }
        .chart-stage { position: relative; }
        .chart-stage canvas, .chart-stage svg { border-radius: 12px; }
        #regionBarContainer { min-height: 600px; }
        #regionTreemapContainer { min-height: 650px; }
        .theme-toggle {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 38px;
            height: 38px;
            border-radius: 999px;
            border: 1px solid rgba(15, 23, 42, 0.25);
            background: rgba(255, 255, 255, 0.85);
            color: #0f172a;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            z-index: 2;
        }
        .theme-toggle:hover { transform: translateY(-1px); }
    </style>
</head>
<body>
    <!-- Header Principal -->
    <header class="main-header">
        <div class="logos-container">
            <img src="thumbnail_Logo observa.png" alt="Universidad Austral de Chile - Centro de Estudios Regionales" class="header-logo-left">
            <img src="thumbnail_images.png" alt="Logo Región" class="header-logo">
        </div>
        <div class="header-content">
            <h1 class="main-title" id="main-title">Observatorio EBCT Chile</h1>
            <p class="subtitle" id="subtitle">Universidad Austral de Chile - Centro de Estudios Regionales</p>
        </div>
    </header>
    
    <!-- Navegación -->
    <nav class="nav-container">
        <div class="nav-links" id="nav-links">
            <span class="nav-link active" data-section="region-chart">Empresas por región</span>
            <span class="nav-link" data-section="treemap-chart">Treemap por región</span>
        </div>
    </nav>
    
    <!-- Container Principal -->
    <div class="container">
        <section id="region-chart" class="section active">
            <h2 class="section-title">Concentración de empresas por región</h2>
            <div class="chart-section">
                <div class="chart-card">
                    <div class="chart-stage">
                        <div id="regionBarContainer"></div>
                        <button id="themeToggleBar" class="theme-toggle" aria-label="Cambiar tema">☼</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="treemap-chart" class="section">
            <h2 class="section-title">Empresas por región (treemap)</h2>
            <div class="chart-section">
                <div class="chart-card">
                    <div class="chart-stage">
                        <div id="regionTreemapContainer"></div>
                        <button id="themeToggleTreemap" class="theme-toggle" aria-label="Cambiar tema">☼</button>
                    </div>
                </div>
            </div>
        </section>
        
        <!-- Secciones dinámicas se generarán aquí -->
        <div id="dynamic-sections"></div>
    </div>
    
    <!-- Footer -->
    <footer class="footer">
        <p class="footer-text" id="footer-text">
            Reporte del Observatorio EBCT Chile<br>
            Universidad Austral de Chile - Centro de Estudios Regionales
        </p>
        <img src="thumbnail_logo cer.png" alt="Universidad Austral de Chile - Centro de Estudios Regionales" class="footer-logo">
    </footer>

        document.addEventListener('DOMContentLoaded', () => {

            const sections = document.querySelectorAll('.section');
            navLinks.forEach((link) => {

                    const targetId = link.dataset.section;
                    navLinks.forEach((l) => l.classList.remove('active'));
                    sections.forEach((section) => section.classList.remove('active'));
                    link.classList.add('active');
                    document.getElementById(targetId)?.classList.add('active');
                });
            });

los-lagos", "value": 1, "displayValue": 1}, {"name": "Ingenieria La Spa", "parent": "los-lagos", "value": 1, "displayValue": 1}, {"name": "Inversiones Oceanscan Spa", "parent": "los-lagos", "value": 1, "displayValue": 1}, {"name": "Keepex Spa", "parent": "los-lagos", "value": 1, "displayValue": 1}, {"name": "Kura Biotech Spa", "parent": "los-lagos", "value": 1, "displayValue": 1}, {"name": "Mares Limpios Spa", "parent": "los-lagos", "value": 1, "displayValue": 1}, {"name": "Oceancare Spa", "parent": "los-lagos", "value": 1, "displayValue": 1}, {"name": "Plancton Andino Spa", "parent": "los-lagos", "value": 1, "displayValue": 1}, {"name": "Rolando Esteban Montero Arismendi Educacion Y Desarrollo De Sistemas Lautaros Eirl", "parent": "los-lagos", "value": 1, "displayValue": 1}, {"name": "Soc Adl Diagnostic Chile Spa", "parent": "los-lagos", "value": 1, "displayValue": 1}];

            const barChart = Highcharts.chart('regionBarContainer', {
                chart: { type: 'bar', backgroundColor: '#ffffff' },
                title: { text: 'Concentración de empresas por región' },
                subtitle: { text: 'Fuente: EBCT Chile 2025' },
                xAxis: {
                    categories: BAR_CATEGORIES,
                    title: { text: null },
                    gridLineWidth: 1,
                    lineWidth: 0
                },
                yAxis: {
                    min: 0,
                    title: { text: 'Número de empresas', align: 'high' },
                    labels: { overflow: 'justify' },
                    gridLineWidth: 0
                },
                tooltip: { valueSuffix: ' empresas' },
                plotOptions: {
                    bar: {
                        borderRadius: '50%',
                        dataLabels: { enabled: true, format: '{point.y}' },
                        groupPadding: 0.1
                    }
                },
                legend: {
                    layout: 'vertical',
                    align: 'right',
                    verticalAlign: 'top',
                    x: -40,
                    y: 80,
                    floating: true,
                    borderWidth: 1,
                    backgroundColor: 'var(--highcharts-background-color, #ffffff)',
                    shadow: true
                },
                credits: { enabled: false },
                series: [{ name: 'Número de empresas', data: BAR_SERIES_DATA }]
            });

            const barToggle = document.getElementById('themeToggleBar');
            const barWrapper = document.querySelector('#region-chart .chart-card');
            let barDarkMode = false;

            function applyBarTheme() {
                barChart.update({
                    chart: { backgroundColor: barDarkMode ? '#0f172a' : '#ffffff' },
                    title: { style: { color: barDarkMode ? '#f8fafc' : '#0f172a' } },
                    subtitle: { style: { color: barDarkMode ? '#cbd5f5' : '#475569' } },
                    xAxis: {
                        labels: { style: { color: barDarkMode ? '#e2e8f0' : '#0f172a' } },
                        gridLineColor: barDarkMode ? 'rgba(248,250,252,0.15)' : '#e2e8f0'
                    },
                    yAxis: {
                        labels: { style: { color: barDarkMode ? '#e2e8f0' : '#0f172a' } },
                        title: { style: { color: barDarkMode ? '#e2e8f0' : '#0f172a' } }
                    },
                    legend: {
                        itemStyle: { color: barDarkMode ? '#f8fafc' : '#0f172a' },
                        backgroundColor: barDarkMode ? 'rgba(15, 23, 42, 0.65)' : 'rgba(255,255,255,1)'
                    },
                    tooltip: {
                        backgroundColor: barDarkMode ? 'rgba(15,23,42,0.9)' : 'rgba(255,255,255,0.95)',
                        style: { color: barDarkMode ? '#f8fafc' : '#0f172a' }
                    },
                    plotOptions: {
                        bar: {
                            dataLabels: { style: { color: barDarkMode ? '#f8fafc' : '#0f172a' } }
                        }
                    }
                });

                if (barWrapper) {
                    barWrapper.style.backgroundColor = barDarkMode ? '#0b1220' : '#ffffff';
                    barWrapper.style.boxShadow = barDarkMode
                        ? '0 8px 30px rgba(0, 0, 0, 0.45)'
                        : '0 8px 30px rgba(15, 23, 42, 0.08)';
                }
            }

            barToggle?.addEventListener('click', () => {
                barDarkMode = !barDarkMode;
                barToggle.textContent = barDarkMode ? '☾' : '☼';
                barToggle.style.backgroundColor = barDarkMode ? 'rgba(15,23,42,0.75)' : 'rgba(255, 255, 255, 0.85)';
                barToggle.style.color = barDarkMode ? '#f8fafc' : '#0f172a';
                barToggle.style.borderColor = barDarkMode ? 'rgba(248, 250, 252, 0.45)' : 'rgba(15, 23, 42, 0.25)';
                applyBarTheme();
            });

            const treemapChart = Highcharts.chart('regionTreemapContainer', {
                chart: { backgroundColor: '#ffffff' },
                series: [{
                    type: 'treemap',
                    name: 'Empresas por región',
                    allowTraversingTree: true,
                    alternateStartingDirection: true,
                    dataLabels: {
                        format: '{point.name}',
                        style: { textOutline: 'none' }
                    },
                    borderRadius: 3,
                    nodeSizeBy: 'leaf',
                    levels: [{
                        level: 1,
                        layoutAlgorithm: 'sliceAndDice',
                        groupPadding: 3,
                        dataLabels: {
                            headers: true,
                            enabled: true,
                            style: {
                                fontSize: '0.6em',
                                fontWeight: 'normal',
                                textTransform: 'uppercase',
                                color: 'var(--highcharts-neutral-color-100, #000)'
                            }
                        },
                        borderRadius: 3,
                        borderWidth: 1,
                        colorByPoint: true
                    }, {
                        level: 2,
                        dataLabels: { enabled: true, inside: false }
                    }],
                    data: TREEMAP_DATA
                }],
                title: { text: 'Empresas biotecnológicas por región', align: 'left' },
                subtitle: { text: 'Fuente: EBCT Chile 2025', align: 'left' },
                tooltip: {
                    useHTML: true,
                    formatter: function () {
                        const rawValue = this.point.displayValue ?? this.point.value ?? 0;
                        const label = rawValue === 1 ? 'empresa' : 'empresas';
                        return `<b>${this.point.name}</b><br/>Total: <b>${rawValue}</b> ${label}`;
                    }
                },
                credits: { enabled: false }
            });

            const treemapToggle = document.getElementById('themeToggleTreemap');
            const treemapWrapper = document.querySelector('#treemap-chart .chart-card');
            let treemapDarkMode = false;

            function applyTreemapTheme() {
                treemapChart.update({
                    chart: { backgroundColor: treemapDarkMode ? '#0f172a' : '#ffffff' },
                    title: { style: { color: treemapDarkMode ? '#f8fafc' : '#0f172a' } },
                    subtitle: { style: { color: treemapDarkMode ? '#cbd5f5' : '#475569' } },
                    tooltip: {
                        backgroundColor: treemapDarkMode ? 'rgba(15,23,42,0.9)' : 'rgba(255,255,255,0.95)',
                        style: { color: treemapDarkMode ? '#f8fafc' : '#0f172a' }
                    },
                    plotOptions: {
                        treemap: {
                            dataLabels: { style: { color: treemapDarkMode ? '#f8fafc' : '#0f172a' } }
                        }
                    }
                });

                treemapChart.series.forEach((series) => {
                    series.points.forEach((point) => {
                        point.dataLabel?.css({ color: treemapDarkMode ? '#f8fafc' : '#0f172a' });
                        point.dataLabelUpper?.css({ color: treemapDarkMode ? '#f8fafc' : '#0f172a' });
                    });
                });

                if (treemapWrapper) {
                    treemapWrapper.style.backgroundColor = treemapDarkMode ? '#0b1220' : '#ffffff';
                    treemapWrapper.style.boxShadow = treemapDarkMode
                        ? '0 8px 30px rgba(0, 0, 0, 0.45)'
                        : '0 8px 30px rgba(15, 23, 42, 0.08)';
                }
            }

            treemapToggle?.addEventListener('click', () => {
                treemapDarkMode = !treemapDarkMode;
                treemapToggle.textContent = treemapDarkMode ? '☾' : '☼';
                treemapToggle.style.backgroundColor = treemapDarkMode ? 'rgba(15,23,42,0.75)' : 'rgba(255, 255, 255, 0.85)';
                treemapToggle.style.color = treemapDarkMode ? '#f8fafc' : '#0f172a';
                treemapToggle.style.borderColor = treemapDarkMode ? 'rgba(248, 250, 252, 0.45)' : 'rgba(15, 23, 42, 0.25)';
                applyTreemapTheme();
            });
        });
    </script>
    <script src="interactive.js"></script>
</body>
</html>
